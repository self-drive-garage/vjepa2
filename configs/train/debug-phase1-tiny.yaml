app: vjepa_drive

folder: /logs/vjepa_drive/debug-phase1-tiny/

data:
  dataset_type: drivingvideodataset
  datasets:
    - /localhome/local-samehm/vjepa2/data/nvidia_av/train.csv
  dataset_names: [nvidia_av]
  datasets_weights: [1.0]
  batch_size: 1
  crop_size: 64
  dataset_fpcs: [2]
  fps: 2
  patch_size: 16
  tubelet_size: 2
  num_workers: 0
  pin_mem: false
  persistent_workers: false
  max_resample_attempts: 8
  trajectory_horizon: 2
  trajectory_dt: 0.5
  trajectory_history_horizon: 2
  trajectory_history_dt: 0.5

data_aug:
  random_resize_aspect_ratio: [0.9, 1.1]
  random_resize_scale: [0.8, 1.0]
  motion_shift: false
  reprob: 0.0
  auto_augment: false

model:
  model_name: vit_micro
  pred_depth: 2
  pred_embed_dim: 96
  pred_num_heads: 3
  use_mask_tokens: true
  use_rope: false
  use_silu: false
  wide_silu: false
  compile_model: false
  use_activation_checkpointing: false
  trajectory_head:
    num_waypoints: 2
    waypoint_dim: 2
    num_modes: 2
    history_dim: 2
    history_tokens: 2
    min_log_std: -3.0
    max_log_std: 1.0
    pooler_depth: 1
    num_heads: 2
    mlp_ratio: 2.0

mask:
  - spatial_scale: [0.4, 0.4]
    temporal_scale: [1.0, 1.0]
    aspect_ratio: [0.75, 1.5]
    num_blocks: 4

loss:
  loss_exp: 1.0
  lambda_traj_start: 1.0
  lambda_traj_end: 2.0
  lambda_traj_schedule: linear
  lambda_traj_ramp_epochs: 2
  loss_ade_weight: 1.0
  loss_fde_weight: 1.0
  loss_nll_weight: 0.5
  loss_calib_weight: 0.1
  loss_smoothness_weight: 0.01
  loss_feasibility_weight: 0.01
  feasibility_speed_limit_mps: 10.0
  feasibility_accel_limit_mps2: 4.0

runtime_safety:
  min_confidence: 0.3
  max_avg_std: 3.0
  max_mode_entropy: 1.0
  speed_limit_mps: 10.0
  accel_limit_mps2: 4.0
  fallback_mode: constant_velocity

optimization:
  lr: 0.0005
  start_lr: 0.0001
  final_lr: 0.00005
  weight_decay: 0.01
  final_weight_decay: 0.01
  warmup: 1
  epochs: 2
  ema: [0.99, 0.99]
  ipe_scale: 1.0
  betas: [0.9, 0.999]
  eps: 1.0e-8
  encoder_lr_scale: 0.5

meta:
  dtype: float32
  use_sdpa: false
  load_checkpoint: false
  seed: 0
  save_every_freq: 5
